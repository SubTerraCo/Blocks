name: Build Android APK

on:
  push:
    branches: [master, main, dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Initialize EAS Project
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if grep -q "projectId" app.json 2>/dev/null; then
            echo "EAS project already configured in app.json"
          elif [ -n "$EAS_PROJECT_ID" ]; then
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('app.json'));
              config.expo.extra = config.expo.extra || {};
              config.expo.extra.eas = config.expo.extra.eas || {};
              config.expo.extra.eas.projectId = '$EAS_PROJECT_ID';
              fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
            "
          else
            echo "EAS project not configured. Run 'cd apps/mobile && eas init' locally."
            exit 1
          fi

      - name: Build Android APK (EAS Cloud)
        id: eas-build
        working-directory: apps/mobile
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --json)
          BUILD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl // empty')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          if [ -n "$BUILD_URL" ]; then
            curl -L -o blocks-${{ inputs.profile || 'preview' }}.apk "$BUILD_URL"
            echo "apk_downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "apk_downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        if: steps.eas-build.outputs.apk_downloaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blocks-android-${{ inputs.profile || 'preview' }}-v${{ steps.version.outputs.version }}
          path: apps/mobile/*.apk
          retention-days: 90
