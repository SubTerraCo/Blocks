name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK (EAS Cloud)
        id: eas-build
        working-directory: apps/mobile
        run: |
          # Start EAS build and wait for completion
          BUILD_OUTPUT=$(eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --json)
          echo "build_output=$BUILD_OUTPUT" >> $GITHUB_OUTPUT
          
          # Extract build URL
          BUILD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl // empty')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          
          # Download APK if URL exists
          if [ -n "$BUILD_URL" ]; then
            curl -L -o blocks-${{ inputs.profile || 'preview' }}.apk "$BUILD_URL"
            echo "apk_downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "apk_downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        if: steps.eas-build.outputs.apk_downloaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blocks-android-${{ inputs.profile || 'preview' }}-v${{ steps.version.outputs.version }}
          path: apps/mobile/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.eas-build.outputs.apk_downloaded == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-android
          name: Blocks Android v${{ steps.version.outputs.version }}
          body: |
            ## 📱 Blocks Android App v${{ steps.version.outputs.version }}
            
            ### Download & Install
            1. Download `blocks-preview.apk` from the **Assets** section below
            2. On your Android device, enable "Install from unknown sources" in Settings > Security
            3. Open the downloaded APK file to install
            
            ### What's Included
            - ✅ Kanban board for task management
            - ✅ Timeline view for daily scheduling
            - ✅ Quick Blocks for immediate tasks
            - ✅ AI assistant integration
            - ✅ Dark/Light theme support
            
            ### Build Info
            - Profile: ${{ inputs.profile || 'preview' }}
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}
          files: apps/mobile/*.apk
          draft: false
          prerelease: ${{ inputs.profile != 'production' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment build status
        if: always()
        run: |
          if [ "${{ steps.eas-build.outputs.apk_downloaded }}" == "true" ]; then
            echo "✅ APK built successfully and uploaded!"
            echo "📥 Download from GitHub Actions artifacts or Releases page"
          else
            echo "⚠️ Build completed but APK download may have failed"
            echo "🔗 Check EAS dashboard for manual download: https://expo.dev"
          fi
