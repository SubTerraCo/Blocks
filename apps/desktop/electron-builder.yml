appId: com.blocks.app
productName: Blocks
copyright: Copyright © 2024 Blocks Team

# pnpm hoists electron to repo root; pin version for electron-builder
electronVersion: 28.1.0

# Version is read from package.json
asar: true
compression: maximum

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - "!**/*.{ts,tsx,map}"

# =============================================================================
# Windows Configuration
# =============================================================================
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
  signAndEditExecutable: false

# NSIS Installer Configuration (Full Install/Uninstall/Modify)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blocks
  uninstallDisplayName: "Blocks ${version}"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: Productivity
  # Terminate tray/minimized instances before upgrade or uninstall (see resources/installer.nsh)
  include: installer.nsh

# =============================================================================
# macOS Configuration
# =============================================================================
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# =============================================================================
# Linux Configuration  
# =============================================================================
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  artifactName: "${productName}-${version}.${ext}"
  desktop:
    Name: Blocks
    Comment: Time Management Application
    Categories: Office;Utility;

# =============================================================================
# Auto-Update Configuration (GitHub Releases)
# =============================================================================
protocols:
  - name: Blocks OAuth
    role: Editor
    schemes:
      - blocks

publish:
  provider: github
  owner: PoweredUpLabs
  repo: Blocks
  releaseType: release

# Generate latest.yml for auto-updates
generateUpdatesFilesForAllChannels: true
