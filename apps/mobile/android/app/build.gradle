apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// Helper function for pnpm monorepo module resolution
String findNodeModulePath(String moduleName) {
  def script = """
    const path = require('path');
    const fs = require('fs');
    const cwd = process.cwd();
    
    const searchPaths = [
      path.join(cwd, 'node_modules', '${moduleName}'),
      path.join(cwd, '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', '..', 'node_modules', '${moduleName}'),
    ];
    
    for (const searchPath of searchPaths) {
      if (fs.existsSync(searchPath)) {
        console.log(searchPath);
        process.exit(0);
      }
    }
    
    try {
      const resolved = require.resolve('${moduleName}/package.json');
      console.log(path.dirname(resolved));
    } catch (e) {
      console.error('Module not found: ${moduleName}');
      process.exit(1);
    }
  """.stripIndent()
  
  def proc = ["node", "-e", script].execute(null, rootDir)
  proc.waitFor()
  return proc.text.trim()
}

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def rnPath = findNodeModulePath('react-native')
  def packageJson = new File(rnPath, 'package.json')
  def json = new groovy.json.JsonSlurper().parse(packageJson)
  def version = json.version
  
  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(major, minor, patch)
}
def rnVersion = getRNVersion()

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    def rnPath = findNodeModulePath('react-native')
    def expoPath = findNodeModulePath('expo')
    def codegenPath = findNodeModulePath('@react-native/codegen')
    def expoCliPath = findNodeModulePath('@expo/cli')
    
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = file(rnPath)
    hermesCommand = new File(rnPath, "sdks/hermesc/%OS-BIN%/hermesc").getAbsolutePath()
    codegenDir = file(codegenPath)
    cliFile = file(expoCliPath)
    bundleCommand = "export:embed"

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.blocks.app'
    defaultConfig {
        applicationId 'com.blocks.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.0.3"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    for (i in 0..<options.size()) options[i] = options[i].trim();
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    def cliPlatformPath = findNodeModulePath('@react-native-community/cli-platform-android')
    apply from: new File(cliPlatformPath, "native_modules.gradle")
    applyNativeModulesAppBuildGradle(project)
}
