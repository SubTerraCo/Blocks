// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Helper function for pnpm monorepo module resolution
String findNodeModulePath(String moduleName) {
  def script = """
    const path = require('path');
    const fs = require('fs');
    const cwd = process.cwd();
    
    const searchPaths = [
      path.join(cwd, 'node_modules', '${moduleName}'),
      path.join(cwd, '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', '..', 'node_modules', '${moduleName}'),
    ];
    
    for (const searchPath of searchPaths) {
      if (fs.existsSync(searchPath)) {
        console.log(searchPath);
        process.exit(0);
      }
    }
    
    try {
      const resolved = require.resolve('${moduleName}/package.json');
      console.log(path.dirname(resolved));
    } catch (e) {
      console.error('Module not found: ${moduleName}');
      process.exit(1);
    }
  """.stripIndent()
  
  def proc = ["node", "-e", script].execute(null, rootDir)
  proc.waitFor()
  return proc.text.trim()
}

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            def rnPath = findNodeModulePath('react-native')
            url(new File(rnPath, 'android'))
        }
        maven {
            // Android JSC is installed from npm
            def jscPath = findNodeModulePath('jsc-android')
            url(new File(jscPath, 'dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
