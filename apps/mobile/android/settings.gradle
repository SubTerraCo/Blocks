pluginManagement {
  def version = providers.exec {
    commandLine("node", "-e", "process.env.NODE_PATH = process.env.NODE_PATH || ''; const paths = [__dirname + '/node_modules', __dirname + '/../../node_modules'].filter(Boolean); process.env.NODE_PATH = paths.join(':'); console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }

  // Try to find @react-native/gradle-plugin
  def gradlePluginPath = null
  try {
    def result = ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir)
    result.waitFor()
    if (result.exitValue() == 0) {
      gradlePluginPath = result.text.trim()
    }
  } catch (Exception e) {
    println "Could not resolve @react-native/gradle-plugin: ${e.message}"
  }
  
  // Fallback: check parent node_modules
  if (!gradlePluginPath || gradlePluginPath.isEmpty() || gradlePluginPath.contains("Error") || gradlePluginPath.contains("null")) {
    def parentNodeModules = new File(rootDir, "../../node_modules/@react-native/gradle-plugin")
    if (parentNodeModules.exists()) {
      gradlePluginPath = new File(parentNodeModules, "package.json").getAbsolutePath()
    }
  }
  
  if (gradlePluginPath && !gradlePluginPath.isEmpty() && !gradlePluginPath.contains("Error") && !gradlePluginPath.contains("null")) {
    def pluginDir = new File(gradlePluginPath).getParentFile()
    if (pluginDir.exists()) {
      includeBuild(pluginDir.toString())
    }
  }
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

def getRNMinorVersion() {
  def version = providers.exec {
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        'node',
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

