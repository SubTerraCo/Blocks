// Helper script for pnpm monorepo module resolution
def findNodeModule = { String moduleName ->
  def script = """
    const path = require('path');
    const fs = require('fs');
    const cwd = process.cwd();
    
    // Search paths for pnpm monorepo structure
    const searchPaths = [
      path.join(cwd, 'node_modules', '${moduleName}'),
      path.join(cwd, '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', 'node_modules', '${moduleName}'),
      path.join(cwd, '..', '..', '..', 'node_modules', '${moduleName}'),
    ];
    
    for (const searchPath of searchPaths) {
      if (fs.existsSync(searchPath)) {
        console.log(searchPath);
        process.exit(0);
      }
    }
    
    // Fallback to require.resolve
    try {
      const resolved = require.resolve('${moduleName}/package.json');
      console.log(path.dirname(resolved));
    } catch (e) {
      console.error('Module not found: ${moduleName}');
      process.exit(1);
    }
  """.stripIndent()
  
  def proc = ["node", "-e", script].execute(null, rootDir)
  proc.waitFor()
  return proc.text.trim()
}

def getReactNativeVersion = {
  def rnPath = findNodeModule('react-native')
  def packageJson = new File(rnPath, 'package.json')
  def json = new groovy.json.JsonSlurper().parse(packageJson)
  return json.version
}

pluginManagement {
  def rnVersion = getReactNativeVersion()
  def (_, reactNativeMinor, reactNativePatch) = rnVersion.split("-")[0].tokenize('.').collect { it.toInteger() }

  def gradlePluginPath = findNodeModule('@react-native/gradle-plugin')
  if (gradlePluginPath && !gradlePluginPath.isEmpty() && new File(gradlePluginPath).exists()) {
    includeBuild(gradlePluginPath)
  }
  
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

def getRNMinorVersion() {
  def rnVersion = getReactNativeVersion()
  def coreVersion = rnVersion.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }
  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        'node',
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

rootProject.name = 'Blocks'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      def rnPath = findNodeModule('react-native')
      from(files(new File(rnPath, "gradle/libs.versions.toml")))
    }
  }
}

def expoPath = findNodeModule('expo')
apply from: new File(expoPath, "scripts/autolinking.gradle")
useExpoModules()

if (getRNMinorVersion() < 75) {
  def cliPlatformPath = findNodeModule('@react-native-community/cli-platform-android')
  apply from: new File(cliPlatformPath, "native_modules.gradle")
  applyNativeModulesSettingsGradle(settings)
}

include ':app'

def gradlePluginPath2 = findNodeModule('@react-native/gradle-plugin')
if (gradlePluginPath2 && !gradlePluginPath2.isEmpty() && new File(gradlePluginPath2).exists()) {
  includeBuild(gradlePluginPath2)
}
